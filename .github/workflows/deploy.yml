name: Deploy - GitHub Packages (tag v* em master)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Distribuição é etapa 2; nem execução manual publica enquanto este guard existir.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github-boilerplate
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Deploy para GitHub Packages
        run: mvn -B deploy -DskipTests=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
