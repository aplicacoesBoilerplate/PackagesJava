name: Documentação
on:
  pull_request:
    paths: ['docs/**', '.release-please-manifest.json', 'pom.xml', 'boilerplate-*/pom.xml', '.github/workflows/documentacao.yml']
  push:
    branches: [master]
    paths: ['docs/**', '.release-please-manifest.json', 'pom.xml', 'boilerplate-*/pom.xml', '.github/workflows/documentacao.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  documentation:
    uses: aplicacoesBoilerplate/.github/.github/workflows/documentacao-pages.yml@080df5aa1c803252ba91fa00ac529fc5e2006c47
    with:
      docs-dir: docs
