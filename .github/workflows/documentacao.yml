name: Documentação
on:
  pull_request:
    paths: ['docs/**', '.release-please-manifest.json', 'pom.xml', 'boilerplate-*/pom.xml', '.github/workflows/documentacao.yml']
  push:
    branches: [master]
    paths: ['docs/**', '.release-please-manifest.json', 'pom.xml', 'boilerplate-*/pom.xml', '.github/workflows/documentacao.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  documentation:
    uses: aplicacoesBoilerplate/.github/.github/workflows/documentacao-pages.yml@4176883e69cf32fe36d1b893e246bbdc03885cf9
    with:
      docs-dir: docs
