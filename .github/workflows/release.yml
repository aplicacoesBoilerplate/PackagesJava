name: Release Please

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, milestoned, demilestoned, closed]
    branches: [master]

permissions:
  contents: read

jobs:
  version-policy:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-release-please-validate.yml@d79c8c621a5fc85d0327fac4aafe13d2cfdb9cd0
    with:
      config-file: release-please-config.json
      project-path: .
      central-ref: d79c8c621a5fc85d0327fac4aafe13d2cfdb9cd0

  validate:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml

  release:
    if: github.event.pull_request.merged == true
    needs: validate
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-release-please-called.yml@d79c8c621a5fc85d0327fac4aafe13d2cfdb9cd0
    with:
      project-type: maven
      central-ref: d79c8c621a5fc85d0327fac4aafe13d2cfdb9cd0
      publish-artifacts: false
      project-path: .
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
