name: CI - Git Flow (develop + PR para master)

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify (sem deploy)
        run: mvn -B verify
