name: CI - Git Flow (develop + PR para master)

on:
  workflow_call:
  push:
    branches: [develop, master, 'release/**']
  pull_request:
    branches: [develop, master, 'release/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify e instalar candidatos localmente (sem deploy)
        run: mvn -B install
      - name: Identificar JAR candidato
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const version = JSON.parse(fs.readFileSync('.release-please-manifest.json', 'utf8'))['.'];
            const jar = fs.readFileSync(`boilerplate-core/target/boilerplate-core-${version}.jar`);
            core.setOutput('version', version);
            core.setOutput('sha256', crypto.createHash('sha256').update(jar).digest('hex'));
      - name: Homologar consumidor com JARs reais
        run: mvn -B -f tests/consumer/consumer-pom.xml "-Dboilerplate.version=${{ steps.candidate.outputs.version }}" "-Dboilerplate.jar.sha256=${{ steps.candidate.outputs.sha256 }}" verify
